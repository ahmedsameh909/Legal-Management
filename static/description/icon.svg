<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Gold gradient for scale beam & pans -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Gold shimmer for pillar -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#D97706"/>
      <stop offset="50%"  stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Drop shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feFlood flood-color="#D97706" flood-opacity="0.45" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle inner shadow for pans -->
    <filter id="panShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blur"/>
      <feOffset dx="0" dy="1"/>
      <feComposite in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- ── Background rounded rect ── -->
  <rect width="128" height="128" rx="22" ry="22" fill="url(#bgGrad)"/>

  <!-- ── Subtle inner border ── -->
  <rect x="3" y="3" width="122" height="122" rx="20" ry="20"
        fill="none" stroke="rgba(217,119,6,0.18)" stroke-width="1.5"/>

  <!-- ════════════════════════════
       SCALES OF JUSTICE
       Central column / pillar
       ════════════════════════════ -->

  <!-- Pillar base platform -->
  <rect x="45" y="100" width="38" height="6" rx="3"
        fill="url(#pillarGrad)" filter="url(#glow)"/>

  <!-- Pillar stem -->
  <rect x="61.5" y="38" width="5" height="62" rx="2"
        fill="url(#pillarGrad)"/>

  <!-- Top orb / finial -->
  <circle cx="64" cy="35" r="5.5"
          fill="url(#goldGrad)" filter="url(#glow)"/>

  <!-- ── Scale beam (horizontal bar) ── -->
  <!-- The beam is slightly tilted to show balance in motion — one side up, one down -->
  <!-- Left side slightly higher, right side slightly lower → balanced / neutral -->
  <line x1="24" y1="53" x2="104" y2="53"
        stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- ── Left scale suspension chain ── -->
  <!-- Chain line from beam end down to pan -->
  <line x1="24" y1="53" x2="24" y2="69"
        stroke="#D97706" stroke-width="1.8" stroke-dasharray="3,2.5"
        stroke-linecap="round"/>

  <!-- ── Right scale suspension chain ── -->
  <line x1="104" y1="53" x2="104" y2="69"
        stroke="#D97706" stroke-width="1.8" stroke-dasharray="3,2.5"
        stroke-linecap="round"/>

  <!-- ── LEFT PAN ── -->
  <!-- Pan bowl (ellipse arc) -->
  <path d="M13,70 Q24,82 35,70"
        fill="none" stroke="url(#goldGrad)" stroke-width="3"
        stroke-linecap="round" filter="url(#glow)"/>
  <!-- Pan rim connecting lines -->
  <line x1="13" y1="70" x2="13" y2="69" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="70" x2="35" y2="69" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left pan connector to chain -->
  <line x1="13" y1="69" x2="24" y2="69" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="69" x2="24" y2="69" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ── RIGHT PAN ── -->
  <path d="M93,70 Q104,82 115,70"
        fill="none" stroke="url(#goldGrad)" stroke-width="3"
        stroke-linecap="round" filter="url(#glow)"/>
  <line x1="93"  y1="70" x2="93"  y2="69" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="115" y1="70" x2="115" y2="69" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="93"  y1="69" x2="104" y2="69" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="115" y1="69" x2="104" y2="69" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>

  <!-- ════════════════════════════
       DOCUMENT / SCROLL beneath scales
       (represents legal documents)
       ════════════════════════════ -->

  <!-- Document body -->
  <rect x="47" y="84" width="34" height="13" rx="2"
        fill="#1E293B" stroke="#D97706" stroke-width="1"/>

  <!-- Document lines (text representation) -->
  <line x1="51" y1="88"  x2="75" y2="88"  stroke="#D97706" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="51" y1="91"  x2="73" y2="91"  stroke="#D97706" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="51" y1="94"  x2="68" y2="94"  stroke="#D97706" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- ════════════════════════════
       BURGUNDY ACCENT DETAILS
       Small decorative elements in #881337
       ════════════════════════════ -->

  <!-- Burgundy accent dot — left of pillar base (seal mark) -->
  <circle cx="46" cy="103" r="3" fill="#881337" opacity="0.85"/>

  <!-- Burgundy accent dot — right of pillar base -->
  <circle cx="82" cy="103" r="3" fill="#881337" opacity="0.85"/>

  <!-- Burgundy thin accent line above base platform -->
  <line x1="45" y1="100" x2="83" y2="100"
        stroke="#881337" stroke-width="1" opacity="0.6"/>

  <!-- Corner flourish — top-left -->
  <path d="M12,20 L12,12 L20,12"
        fill="none" stroke="#881337" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Corner flourish — top-right -->
  <path d="M116,20 L116,12 L108,12"
        fill="none" stroke="#881337" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Corner flourish — bottom-left -->
  <path d="M12,108 L12,116 L20,116"
        fill="none" stroke="#881337" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Corner flourish — bottom-right -->
  <path d="M116,108 L116,116 L108,116"
        fill="none" stroke="#881337" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

</svg>
